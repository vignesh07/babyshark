name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go tests
        run: |
          go test ./...
          go vet ./...
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: |
          cargo test --manifest-path rust/Cargo.toml
